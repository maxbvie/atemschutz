<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#b91c1c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ASLA Silber Quiz</title>
    <style>
        :root {
            --primary: #b91c1c; /* Feuerwehr Rot */
            --primary-dark: #991b1b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --correct: #16a34a;
            --wrong: #dc2626;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background-color: var(--primary); color: white;
            padding: 1rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky; top: 0; z-index: 10;
        }
        
        header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px;}
        header p { margin: 4px 0 0 0; font-size: 0.85rem; opacity: 0.9; }

        main {
            flex: 1; width: 100%; max-width: 600px; margin: 0 auto;
            padding: 1.5rem 1rem; display: flex; flex-direction: column;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mt-4 { margin-top: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }

        /* UI Elements */
        .card {
            background: var(--surface); border-radius: 12px;
            padding: 1.5rem; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .btn {
            display: block; width: 100%; padding: 1rem;
            border: 2px solid var(--border); border-radius: 12px;
            background: var(--surface); color: var(--text-main);
            font-size: 1rem; font-weight: 500; text-align: left;
            cursor: pointer; transition: all 0.2s ease;
            margin-bottom: 0.75rem;
        }
        
        .btn:active { transform: scale(0.98); }
        .btn:disabled { cursor: not-allowed; opacity: 0.8; }

        .btn.primary { background: var(--primary); color: white; border-color: var(--primary); text-align: center; font-weight: bold; }
        .btn.primary:active { background: var(--primary-dark); }
        
        .btn.secondary { background: #f1f5f9; text-align: center; border-color: #cbd5e1; }

        .btn.correct { background: var(--correct); color: white; border-color: var(--correct); }
        .btn.wrong { background: var(--wrong); color: white; border-color: var(--wrong); }

        .action-row { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
        .action-row .btn { margin-bottom: 0; text-align: center; }

        /* Progress Bar */
        .progress-container {
            width: 100%; height: 8px; background: #e2e8f0;
            border-radius: 4px; overflow: hidden; margin-bottom: 1.5rem;
        }
        .progress-fill {
            height: 100%; background: var(--primary);
            width: 0%; transition: width 0.3s ease;
        }

        .stats {
            display: flex; justify-content: space-between;
            font-size: 0.875rem; color: var(--text-muted); font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .q-tag {
            display: inline-block; background: #fee2e2; color: var(--primary);
            padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem;
            font-weight: 700; text-transform: uppercase; margin-bottom: 0.75rem;
        }

        h2.question-text { margin: 0 0 1.5rem 0; font-size: 1.2rem; line-height: 1.4; color: var(--text-main); }
        
        .answer-box {
            background: #f0fdf4; border: 1px solid #bbf7d0;
            padding: 1rem; border-radius: 8px; margin-top: 1rem;
        }
        .answer-box p { margin: 0; color: #166534; font-weight: 500; line-height: 1.5;}

        /* Options for Home Screen */
        .toggle-container {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem; background: white; border-radius: 8px; border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

    </style>
</head>

            { id: 'T3_33', cat: 'Teil 3', type: 'open', q: 'Wie hoch ist der Kohlendioxid-Anteil in der Ausatemluft?', a: 'Ca. 4%' },
            { id: 'T3_34', cat: 'Teil 3', type: 'open', q: 'Welches Gas ist für die Steuerung der Atmung verantwortlich?', a: 'Kohlenstoffdioxid' },
            { id: 'T3_35', cat: 'Teil 3', type: 'open', q: 'Was versteht man unter dem "MAK-Wert"?', a: 'Maximale Arbeitsplatzkonzentration' },
            { id: 'T3_36', cat: 'Teil 3', type: 'open', q: 'Welche Bezeichnung (inkl. Filterklassen) hat der im Feuerwehrdienst hauptsächlich verwendete Filter?', a: 'Feuerwehr-Kombinationsfilter, A2B2E2K2Hg/P3' },

            { id: 'T3_38', cat: 'Teil 3', type: 'open', q: 'Zu welchem Stützpunktfahrzeug des OÖLFV ist eine Gasspürpumpe mit Prüfröhrchen verlagert?', a: 'Gefährliche-Stoffe-Fahrzeug' },
            { id: 'T3_39', cat: 'Teil 3', type: 'open', q: 'Was ist Kohlendioxid? (Chemische Abkürzung, Vorkommen, physikalische Eigenschaft)', a: '• Abkürzung: CO2\n• Vorkommen: Vollständige Verbrennung, Abgase (Industrie/Verkehr), Gärkeller, Silos\n• Eigenschaft: Schwerer als Luft' },
            { id: 'T3_40', cat: 'Teil 3', type: 'open', q: 'Berechne den Luftverbrauch pro Minute.\nGerät: 2x4L/200bar. Anfangsdruck: 200 bar, Enddruck: 80 bar.\nAnfangszeit: 10:20 Uhr, Endzeit: 10:44 Uhr', a: 'Druckverbrauch: 200 - 80 = 120 bar\nVolumen: 2x4 = 8 Liter\nGesamtverbrauch: 120 x 8 = 960 Liter\nEinsatzdauer: 24 Minuten\nLuftverbrauch pro Min: 960 / 24 = 40 Liter/min' }
        ];

        // --- 2. STATE ---
        let currentPool = [];
        let currentIndex = 0;
        let score = 0;
        let shuffleMode = false;

        const appDiv = document.getElementById('app');

        // --- 3. RENDER FUNCTIONS ---
        function shuffleArray(array) {
            let curId = array.length, temp, rndId;
            while (0 !== curId) {
                rndId = Math.floor(Math.random() * curId);
                curId -= 1;
                temp = array[curId];
                array[curId] = array[rndId];
                array[rndId] = temp;
            }
            return array;
        }

        function renderMenu() {
            appDiv.innerHTML = `
                <div class="card text-center mb-4">
                    <h2>Bereit für die Prüfung?</h2>
                    <p style="color:var(--text-muted); font-size:0.9rem;">Wähle einen Bereich zum Üben aus.</p>
                </div>
                
                <div class="toggle-container">
                    <label style="font-weight:600; color:var(--text-main);">🔀 Zufällige Reihenfolge</label>
                    <label class="switch">
                        <input type="checkbox" id="shuffleToggle" ${shuffleMode ? 'checked' : ''} onchange="toggleShuffle(this)">
                        <span class="slider"></span>
                    </label>
                </div>

                <button class="btn primary" onclick="startQuiz('all')">Alle Fragen üben (131)</button>
                <button class="btn" onclick="startQuiz('Station 4')">Station 4 (Mündlich) - 11 Fragen</button>
                <button class="btn" onclick="startQuiz('Teil 1')">Teil 1 - 40 Fragen</button>
                <button class="btn" onclick="startQuiz('Teil 2')">Teil 2 - 40 Fragen</button>
                <button class="btn" onclick="startQuiz('Teil 3')">Teil 3 - 40 Fragen</button>
            `;
        }

        function toggleShuffle(cb) {
            shuffleMode = cb.checked;
        }

        function startQuiz(category) {
            if (category === 'all') {
                currentPool = [...questionsData];
            } else {
                currentPool = questionsData.filter(q => q.cat === category);
            }

            if (shuffleMode) shuffleArray(currentPool);

            currentIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentPool[currentIndex];
            const progress = ((currentIndex) / currentPool.length) * 100;
            
            let html = `
                <div class="stats">
                    <span>Frage ${currentIndex + 1} von ${currentPool.length}</span>
                    <span>Richtig: ${score}</span>
                </div>
                <div class="progress-container">
                    <div class="progress-fill" style="width: ${progress}%"></div>
                </div>

                <div class="card">
                    <span class="q-tag">${q.cat} ${q.type === 'mc' ? '• Multiple Choice' : '• Offene Frage'}</span>
                    <h2 class="question-text">${q.q.replace(/\n/g, '<br>')}</h2>
            `;

            if (q.type === 'mc') {
                q.opts.forEach((opt, idx) => {
                    html += `<button class="btn mc-btn" onclick="handleMcAnswer(${idx}, this)">${opt}</button>`;
                });
                html += `</div>`; // close card
                html += `
                    <div id="next-container" class="hidden">
                        <button class="btn primary mt-4" onclick="nextQuestion()">Weiter zur nächsten Frage</button>
                    </div>
                `;
            } else {
                html += `
                    <div id="answer-reveal" class="hidden">
                        <div class="answer-box">
                            <p>${q.a.replace(/\n/g, '<br>')}</p>
                        </div>
                    </div>
                </div>`; // close card
                
                html += `
                    <div id="action-reveal">
                        <button class="btn secondary" onclick="showAnswer()">Lösung anzeigen</button>
                    </div>
                    <div id="action-eval" class="action-row hidden">
                        <button class="btn wrong" onclick="handleOpenAnswer(false)">Nicht gewusst ❌</button>
                        <button class="btn correct" onclick="handleOpenAnswer(true)">Gewusst ✅</button>
                    </div>
                `;
            }

            appDiv.innerHTML = html;
        }

        function handleMcAnswer(selectedIndex, btnEl) {
            const q = currentPool[currentIndex];
            const allBtns = document.querySelectorAll('.mc-btn');
            
            // Disable all buttons
            allBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.ans) {
                btnEl.classList.add('correct');
                score++;
            } else {
                btnEl.classList.add('wrong');
                // Highlight correct one
                allBtns[q.ans].classList.add('correct');
            }

            // Update score display immediately
            document.querySelector('.stats span:last-child').innerText = `Richtig: ${score}`;
            document.getElementById('next-container').classList.remove('hidden');
        }

        function showAnswer() {
            document.getElementById('answer-reveal').classList.remove('hidden');
            document.getElementById('action-reveal').classList.add('hidden');
            document.getElementById('action-eval').classList.remove('hidden');
        }

        function handleOpenAnswer(knewIt) {
            if (knewIt) score++;
            nextQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= currentPool.length) {
                renderResult();
            } else {
                renderQuestion();
            }
        }

        function renderResult() {
            const percentage = Math.round((score / currentPool.length) * 100);
            let message = "Weiter üben!";
            if (percentage >= 90) message = "Perfekt! Du bist bereit!";
            else if (percentage >= 70) message = "Gute Arbeit!";

            appDiv.innerHTML = `
                <div class="card text-center" style="padding: 3rem 1rem;">
                    <h2 style="font-size: 3rem; margin: 0;">${percentage}%</h2>
                    <p style="font-size: 1.2rem; font-weight: bold; color: var(--primary);">${message}</p>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">Du hast ${score} von ${currentPool.length} Fragen richtig beantwortet.</p>
                    
                    <button class="btn primary" onclick="renderMenu()">Zurück zum Menü</button>
                </div>
            `;
        }

        // Initialize App
        renderMenu();

    </script>
